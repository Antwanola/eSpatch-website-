<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1010" viewBox="0 0 700 1010" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16283D"/>
      <stop offset="1" stop-color="#0F1E30"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3048"/>
      <stop offset="1" stop-color="#101F33"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#01decb" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#01decb" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#01decb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubBody" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#17334A"/>
      <stop offset="1" stop-color="#0E1F32"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#01decb" fill-opacity="0.13"/>
    </pattern>
    <marker id="arw" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#01decb" fill-opacity="0.9"/>
    </marker>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="700" height="1010" fill="#0D1B2A"/>
  <g stroke="#FFFFFF" stroke-opacity="0.032" stroke-width="20" stroke-linecap="round">
    <path d="M-20 236 L720 200"/>
    <path d="M-20 742 L720 786"/>
    <path d="M198 -20 L142 1030"/>
    <path d="M556 -20 L614 1030"/>
  </g>
  <rect width="700" height="1010" fill="url(#dots)"/>
  <rect x="-60" y="180" width="560" height="560" fill="url(#hubGlow)"/>

  <!-- step 01 -->
  <rect x="36" y="46" width="628" height="150" rx="24" fill="url(#cardGrad)" stroke="#01decb" stroke-opacity="0.20" stroke-width="1.8"/>
  <circle cx="106" cy="121" r="36" fill="#01decb" fill-opacity="0.10" stroke="#01decb" stroke-opacity="0.30"/>
  <g transform="translate(106,121)" stroke="#01decb" stroke-width="2.8" fill="#01decb" fill-opacity="0.12" stroke-linejoin="round">
    <path d="M-18 -7 L0 -17 L18 -7 L18 12 L0 22 L-18 12 Z"/>
    <path d="M-18 -7 L0 3 L18 -7" fill="none"/><path d="M0 3 L0 22" fill="none"/>
  </g>
  <text x="172" y="112" font-size="34" font-weight="700" fill="#FFFFFF">Order Received</text>
  <text x="172" y="152" font-size="23" fill="#93A3B4">Straight from your platform API</text>
  <circle cx="616" cy="121" r="24" fill="#7c6af7" fill-opacity="0.16" stroke="#7c6af7" stroke-opacity="0.5"/>
  <text x="616" y="129" font-size="18" font-weight="700" fill="#b3a8ff" text-anchor="middle">01</text>

  <path d="M240 196 L240 240" fill="none" stroke="#01decb" stroke-opacity="0.5" stroke-width="3" marker-end="url(#arw)"/>
  <text x="266" y="228" font-size="19" letter-spacing="2" fill="#63798D">VIA API</text>

  <!-- step 02 : the engine -->
  <rect x="36" y="242" width="628" height="256" rx="26" fill="url(#engineGrad)" stroke="#7c6af7" stroke-opacity="0.38" stroke-width="2"/>
  <g fill="none" stroke="#01decb" stroke-dasharray="4 10">
    <circle cx="152" cy="374" r="100" stroke-opacity="0.10"/>
    <circle cx="152" cy="374" r="82" stroke-opacity="0.20"/>
  </g>
  <circle cx="152" cy="374" r="64" fill="url(#hubBody)" stroke="#01decb" stroke-opacity="0.55" stroke-width="2.2"/>
  <g transform="translate(152,374)">
    <g stroke="#01decb" stroke-opacity="0.55" stroke-width="2">
      <path d="M0 0 L-27 -15"/><path d="M0 0 L27 -15"/><path d="M0 0 L-23 18"/><path d="M0 0 L23 18"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#01decb"/>
    <g fill="#0D1B2A" stroke="#01decb" stroke-width="2.2">
      <circle cx="-27" cy="-15" r="5"/><circle cx="27" cy="-15" r="5"/>
      <circle cx="-23" cy="18" r="5"/><circle cx="23" cy="18" r="5"/>
    </g>
  </g>
  <text x="264" y="322" font-size="18" letter-spacing="3" fill="#a094ff">eSPATCH ENGINE</text>
  <text x="264" y="368" font-size="36" font-weight="700" fill="#01decb">Smart Dispatch</text>
  <text x="264" y="410" font-size="23" fill="#93A3B4">Matches the nearest</text>
  <text x="264" y="442" font-size="23" fill="#93A3B4">vetted rider in seconds</text>
  <circle cx="616" cy="286" r="24" fill="#7c6af7" fill-opacity="0.16" stroke="#7c6af7" stroke-opacity="0.5"/>
  <text x="616" y="294" font-size="18" font-weight="700" fill="#b3a8ff" text-anchor="middle">02</text>

  <path d="M240 498 L240 542" fill="none" stroke="#01decb" stroke-opacity="0.5" stroke-width="3" marker-end="url(#arw)"/>
  <text x="266" y="530" font-size="19" letter-spacing="2" fill="#63798D">RIDER ASSIGNED</text>

  <!-- step 03 -->
  <rect x="36" y="544" width="628" height="150" rx="24" fill="url(#cardGrad)" stroke="#01decb" stroke-opacity="0.20" stroke-width="1.8"/>
  <circle cx="106" cy="619" r="36" fill="#01decb" fill-opacity="0.10" stroke="#01decb" stroke-opacity="0.30"/>
  <g transform="translate(106,619)" stroke="#01decb" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-16" cy="10" r="9"/><circle cx="16" cy="10" r="9"/>
    <path d="M-16 10 L-10 0 L4 0 L11 -7"/>
    <path d="M-12 -2 L-4 -10 L5 -10 L6 0 Z" fill="#01decb" fill-opacity="0.22"/>
    <path d="M11 -7 L16 -15 L22 -15"/>
    <path d="M11 -7 L16 10"/>
  </g>
  <text x="172" y="610" font-size="34" font-weight="700" fill="#FFFFFF">Last-Mile Delivery</text>
  <text x="172" y="650" font-size="23" fill="#93A3B4">Live GPS to the customer door</text>
  <circle cx="616" cy="619" r="24" fill="#7c6af7" fill-opacity="0.16" stroke="#7c6af7" stroke-opacity="0.5"/>
  <text x="616" y="627" font-size="18" font-weight="700" fill="#b3a8ff" text-anchor="middle">03</text>

  <path d="M240 694 L240 738" fill="none" stroke="#01decb" stroke-opacity="0.5" stroke-width="3" marker-end="url(#arw)"/>
  <text x="266" y="726" font-size="19" letter-spacing="2" fill="#63798D">PROOF OF DELIVERY</text>

  <!-- step 04 -->
  <rect x="36" y="740" width="628" height="150" rx="24" fill="url(#cardGrad)" stroke="#01decb" stroke-opacity="0.20" stroke-width="1.8"/>
  <circle cx="106" cy="815" r="36" fill="#01decb" fill-opacity="0.10" stroke="#01decb" stroke-opacity="0.30"/>
  <g transform="translate(106,815)" stroke="#01decb" stroke-width="2.8" fill="none" stroke-linejoin="round">
    <rect x="-19" y="-14" width="38" height="28" rx="7" fill="#01decb" fill-opacity="0.14"/>
    <path d="M-19 -5 L19 -5"/>
    <circle cx="10" cy="5" r="3.4" fill="#01decb" stroke="none"/>
  </g>
  <text x="172" y="806" font-size="34" font-weight="700" fill="#FFFFFF">Weekly Settlement</text>
  <text x="172" y="846" font-size="23" fill="#93A3B4">Reconciled report and payout</text>
  <circle cx="616" cy="815" r="24" fill="#7c6af7" fill-opacity="0.16" stroke="#7c6af7" stroke-opacity="0.5"/>
  <text x="616" y="823" font-size="18" font-weight="700" fill="#b3a8ff" text-anchor="middle">04</text>

  <!-- stat chips -->
  <g>
    <rect x="75" y="924" width="176" height="52" rx="26" fill="#101F31" stroke="#01decb" stroke-opacity="0.16"/>
    <circle cx="101" cy="950" r="5.5" fill="#01decb"/>
    <text x="119" y="958" font-size="21" fill="#B4C2D0">302 days/yr</text>
    <rect x="267" y="924" width="143" height="52" rx="26" fill="#101F31" stroke="#01decb" stroke-opacity="0.16"/>
    <circle cx="293" cy="950" r="5.5" fill="#01decb"/>
    <text x="311" y="958" font-size="21" fill="#B4C2D0">Live GPS</text>
    <rect x="426" y="924" width="198" height="52" rx="26" fill="#101F31" stroke="#01decb" stroke-opacity="0.16"/>
    <circle cx="452" cy="950" r="5.5" fill="#01decb"/>
    <text x="470" y="958" font-size="21" fill="#B4C2D0">Vetted riders</text>
  </g>
</svg>
